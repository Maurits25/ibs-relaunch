<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="IBS Industriebodensanierung Schmäing">
  <title>IBS Industriebodensanierung Schmäing</title>
  <g fill="currentColor">
